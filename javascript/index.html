<!DOCTYPE html>
<html>

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <script type="text/javascript" src="sha256.js"></script>
    <script type="text/javascript" src="jsencrypt.js"></script>
    <style>
        input,
        button,
        textarea {
            width: 100%;
            padding: 3px;
        }
    </style>
</head>

<body>
    <fieldset>
        <legend>INPUT</legend>

        <label for="apikey">API Key</label>
        <br/>
        <input type="text" id="apikey" name="apikey" value="myAPIkey">
        <br/>

        <label for="timestamp">Timestamp</label>
        <br/>
        <input type="text" id="timestamp" name="timestamp">
        <br/>

        <label for="pubkey">API Secret</label>
        <br/>
        <textarea id="pubkey" rows="15" cols="65">-----BEGIN PUBLIC KEY-----
MIGfMA0GCSqGSIb3DQEBAQUAA4GNADCBiQKBgQCgBSU90PX4WyXFAZ/+M84dJNEi
/0j5OermfydTU4g2JvnpO6BOQjNpb5+mOLjVoij7DWTdDtx1WThRm04N3DVuyh+a
5cledvMbcngvyiXpQCdskT9bVmI4QLbmRny46S7MER1jhziMQRfRw9gbmlB2iCEq
n21kDr842Q+WDtLE4QIDAQAB
-----END PUBLIC KEY-----</textarea>
        <br/>
    </fieldset>
    
    <br/>
    <button onclick="refreshTime();">Refresh</button>
    <br/>
    <br/>

    <fieldset>
        <legend>OUTPUT</legend>

        <label for="uncrypted">SHA 256:</label>
        <br/>
        <textarea id="uncrypted" name="uncrypted" type="text" rows=4 cols=70></textarea>
        <br/>

        <label for="content">Signed:</label>
        <br/>
        <textarea id="content" rows=4 cols=70></textarea>

        <label for="output">Output:</label>
        <br/>
        <textarea id="output" rows=4 cols=70></textarea>
    </fieldset>

    <script type="text/javascript">

        function refreshTime() {
            var today = new Date();
            setTimestamp(today.toISOString());
            hashAndEncrypt();
        }

        function publicKey() { return document.getElementById('pubkey').value; }
        function APIkey() { return document.getElementById('apikey').value; }
        function timestamp() { return document.getElementById('timestamp').value; }
        function textToEncrypt() { return document.getElementById('uncrypted').value; }
        function showResult(value) { document.getElementById('content').value = value; }
        function showSHA256(value) { document.getElementById('uncrypted').value = value; }
        function setTimestamp(value) { document.getElementById('timestamp').value = value; }


        function hash(values) {  // makes SHA256-hash from values (concatted with "_")
            var shaObj = new jsSHA("SHA-256", "TEXT");
            shaObj.update(values.join("_"));
            var myhash = shaObj.getHash("HEX");
            return myhash;
        }

        function encryptHash(hash, publicKey) { // RSA/PKCS#1-v1.5 encrypts the hash with the public key (not a signature - see root README)
            var encrypt = new JSEncrypt();
            encrypt.setPublicKey(publicKey);
            var encrypted = encrypt.encrypt(hash);
            return encrypted;
        }

        function decrypt(encrypted, privateKey) {
            // Decrypt with the private key...
            var decrypt = new JSEncrypt();
            decrypt.setPrivateKey(privateKey);
            var uncrypted = decrypt.decrypt(encrypted);
            return uncrypted;
        }

        function hashAndEncrypt() {
            var signature = hash([APIkey(),timestamp()]);
            var uncrypted = signature;
            showSHA256(uncrypted);
            var signed = encryptHash(signature, publicKey());
            if (signed === false) {
                showResult('ERROR: encryption failed - check that API Secret is a valid PEM public key');
                document.getElementById('output').value = '';
                return;
            }
            showResult(signed);

            output = {
                apikey: APIkey(),
                timestamp: timestamp(),
                signature: signed
            }
            document.getElementById('output').value = JSON.stringify(output);
        }

        refreshTime();

        document.querySelectorAll('input, textarea').forEach(function (el) {
            el.addEventListener('change', hashAndEncrypt);
        });

    </script>
</body>

</html>
